<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Blog</title>

   <link rel="stylesheet" href="/static/style.css">


</head>

<body>

    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <header class="navbar">

        <div class="container navbar-content">

            <h1>My Blog</h1>

            <button
                class="create-btn"
                onclick="openCreateModal()"
            >
                + Create Post
            </button>

        </div>

    </header>


    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->

    <main class="container">

        <section class="hero">

            <h2>Latest Posts</h2>

            <p>
                Share your thoughts, stories and images.
            </p>

        </section>


        <!-- Loading -->

        <div
            id="loading"
            class="loading"
        >
            Loading posts...
        </div>


        <!-- Posts -->

        <div
            id="postsContainer"
            class="posts-grid"
        >
        </div>


        <!-- Empty state -->

        <div
            id="emptyState"
            class="empty-state hidden"
        >

            <h3>No posts yet</h3>

            <p>
                Create your first blog post.
            </p>

            <button
                onclick="openCreateModal()"
                class="create-btn"
            >
                Create Post
            </button>

        </div>

    </main>


    <!-- ==========================================
         MODAL
    =========================================== -->

    <div
        id="postModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Create Post
                </h2>

                <button
                    class="close-btn"
                    onclick="closeModal()"
                >
                    ×
                </button>

            </div>


            <!-- FORM -->

            <form
                id="postForm"
                enctype="multipart/form-data"
            >

                <!-- Hidden ID -->

                <input
                    type="hidden"
                    id="postId"
                >


                <!-- Title -->

                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter post title"
                        maxlength="200"
                        required
                    >

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Write your post..."
                        rows="7"
                        required
                    ></textarea>

                </div>


                <!-- Image -->

                <div class="form-group">

                    <label for="image">
                        Image
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
                    >

                    <small>
                        Maximum size: 10 MB
                    </small>

                </div>


                <!-- Image preview -->

                <div
                    id="imagePreviewContainer"
                    class="image-preview-container hidden"
                >

                    <img
                        id="imagePreview"
                        src=""
                        alt="Image preview"
                    >

                </div>


                <!-- Buttons -->

                <div class="form-actions">

                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="closeModal()"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="submit-btn"
                        id="submitBtn"
                    >
                        Create Post
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

  <script src="/static/script.js"></script>

</body>

</html>
